<!DOCTYPE html>
<html lang="th">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://czp.dga.or.th/cportal/sdk/css/v1/trunks.min.css" />
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Material+Icons|Material+Icons+Round" rel="stylesheet">


  <title>ข้อมูลผู้ใช้ - DGA Connect</title>

  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: #f3f5fa;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      animation: fadeIn 0.5s ease;
    }

    .card-header {
      background: #1976d2;
      color: #fff;
      padding: 20px 16px;
      text-align: center;
    }

    .card-body {
      padding: 20px 24px;
      color: #333;
    }

    .info-section {
      background: #f7f8fc;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .info-section h3 {
      margin-top: 0;
      font-size: 16px;
      color: #1976d2;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      padding: 4px 0;
    }

    .btn-refresh {
      width: 100%;
      background: #1976d2;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-refresh:hover {
      background: #125ca4;
    }

    .error {
      color: red;
      text-align: center;
      margin-top: 10px;
      font-weight: 500;
    }

    .log-box {
      background: #1e1e1e;
      color: #00ff99;
      font-family: monospace;
      font-size: 13px;
      padding: 12px;
      border-radius: 10px;
      height: 160px;
      overflow-y: auto;
      margin-top: 15px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .loader-container {
      text-align: center;
      color: #555;
    }

    .spinner {
      border: 5px solid #eee;
      border-top: 5px solid #1976d2;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="loader" class="loader-container">
    <div class="spinner"></div>
    <p>กำลังดึงข้อมูลจากระบบ ....</p>
  </div>

  <div id="userCard" class="card" style="display:none;">
    <div class="card-header">
      <h2>ข้อมูลผู้ใช้</h2>
    </div>

    <div class="card-body">
      <div class="info-section">
        <h3>ข้อมูลส่วนตัว</h3>
        <div class="info-row"><span>รหัสประชาชน:</span><span id="citizenId">-</span></div>
        <div class="info-row"><span>ชื่อ:</span><span id="firstname">-</span></div>
        <div class="info-row"><span>นามสกุล:</span><span id="lastname">-</span></div>
        <div class="info-row"><span>เบอร์มือถือ:</span><span id="mobile">-</span></div>
        <div class="info-row"><span>อีเมล:</span><span id="email">-</span></div>
        <div class="info-row"><span>CZP_userID:</span><span id="czpUserId">-</span></div>
      </div>

      <div class="info-section">
        <h3>ข้อมูลระบบ</h3>
        <div class="info-row"><span>App ID:</span><span id="appId">-</span></div>
        <div class="info-row"><span>mToken:</span><span id="mToken">-</span></div>
        <div class="info-row"><span>Agent ID:</span><span id="agentId">-</span></div>
        <div class="info-row"><span>Consumer Key:</span><span id="consumerKey">-</span></div>
      </div>

      <button class="btn-refresh" onclick="initData()">🔄 รีเฟรชข้อมูล</button>
      <div class="error" id="errorMsg"></div>

      <div class="info-section">
        <h3>Log</h3>
        <div id="logBox" class="log-box"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    if (typeof axios === "undefined") {
      document.write('<script src="/js/axios.min.js"><\/script>');
    }
  </script>


  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    async function initData() {
      const loader = document.getElementById("loader");
      const card = document.getElementById("userCard");
      const errorMsg = document.getElementById("errorMsg");
      const logBox = document.getElementById("logBox");

      const log = (msg) => {
        logBox.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
        logBox.scrollTop = logBox.scrollHeight;
      };

      log("เริ่มดึงข้อมูลผู้ใช้...");

      try {
        loader.style.display = "flex";
        card.style.display = "none";
        errorMsg.textContent = "";

        // ✅ [1] Validate เพื่อขอ Token จาก backend (.env)
        log("กำลังเรียก /test3/api/validate...");
        const validateRes = await axios.get("/test3/api/validate");
        const token = validateRes.data.token;
        log(`✅ ได้ Token จาก validate: ${token}`);

        // ✅ [2] ดึง appId และ mToken จาก SDK หรือ URL
        // const mToken = "eac2b5855c124a6682035ac5303f5327"
        // const appId = "ec90675a-1fd4-498f-943c-2b5cfb19ffc6"


        const appId =
          (window.czpSdk && window.czpSdk.getAppId?.()) ||
          new URLSearchParams(window.location.search).get("appId");
        // const mToken =
        (window.czpSdk && window.czpSdk.getToken?.()) ||
          new URLSearchParams(window.location.search).get("mToken");
        const DataDpoc =
          (window.czpSdk && window.czpSdk.ntResponse?.()) ||
          new URLSearchParams(window.location.search).get("data");

        log(`📱 appId: ${appId}`);
        log(`🔑 mToken: ${mToken}`);
        // log(`🗂 DataDpoc: ${DataDpoc}`);

        if (!appId || !mToken) {
          throw new Error("ไม่พบ appId หรือ mToken (หมดอายุหรือยังไม่ได้รับสิทธิ์)");
        }

        // ✅ [3] ดึงข้อมูลผู้ใช้จาก backend
        log("กำลังเรียก /test3/api/login...");
        const loginRes = await axios.post("/test3/api/login", { appId, mToken, token });
        const data = loginRes.data.user;
        log("✅ ดึงข้อมูลผู้ใช้สำเร็จ");

        // ✅ [4] ทดสอบส่ง Notification
        log("กำลังเรียก /test3/api/notification...");
        log("--------------------------------------------------")
        log("CZP_userID" + data.userId);
        log("--------------------------------------------------")
        const notiRes = await axios.post("/test3/api/notification", {
          appId,
          userId: data.userId,
          token,
          message: "ทดสอบข้อความจากระบบ DGA Connect",
        });

        if (notiRes.data.success) {
          log("✅ ส่ง Notification สำเร็จ");
        } else {
          log("⚠️ ส่ง Notification ไม่สำเร็จ");
        }

        // ✅ [5] แสดงผลข้อมูลผู้ใช้
        document.getElementById("appId").textContent = appId;
        document.getElementById("mToken").textContent = mToken;
        document.getElementById("citizenId").textContent = data.citizenId || "-";
        document.getElementById("firstname").textContent = data.firstName || "-";
        document.getElementById("lastname").textContent = data.lastName || "-";
        document.getElementById("mobile").textContent = data.mobile || "-";
        document.getElementById("email").textContent = data.email || "-";

        loader.style.display = "none";
        card.style.display = "block";
      } catch (err) {
        console.error("❌ ERROR:", err);
        log(`❌ ERROR: ${err.message}`);
        loader.style.display = "none";
        card.style.display = "block";
        errorMsg.textContent = "เกิดข้อผิดพลาด: " + err.message;
      }
    }

    window.addEventListener("load", initData);
  </script>

</body>

</html>
